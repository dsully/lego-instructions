[project]
authors = [
  { name = "Dan Sully", email = "dan+github@sully.org" },
]
dependencies = [
  "beautifulsoup4",
  "click",
  "iniparse",
  "httpx",
  "rich>=12.5.1",
]
description = ""
license = { text = "MIT" }
name = "lego-instructions"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1"

[project.scripts]
download-lego-instructions = "script:cli"

[project.optional-dependencies]
[build-system]
build-backend = "pdm.pep517.api"
requires = ["pdm-pep517>=1.0.0"]

[tool]
[tool.pdm]
[tool.pdm.dev-dependencies]
dev = [
  "mypy>=0.971",
  "flake8>=2.3.0",
  "pyproject-flake8>=0.0.1a5",
  "black>=22.6.0",
]

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "bs4",
  "iniparse",
]

[tool.black]
line-length = 120

[tool.isort]
include_trailing_comma = true
line_length = 120
multi_line_output = 3
